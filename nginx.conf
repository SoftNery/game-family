server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # PNG já vem comprimido; comprimir só o que rende
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # O HTML é a peça central: ele carrega as referências versionadas dos
    # scripts, então precisa estar sempre fresco. no-store em vez de no-cache
    # porque revalidação depende de o proxy do caminho colaborar, e é ele que
    # costuma servir versão velha depois do deploy. O arquivo tem ~5 KB.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # css/js já vêm com ?v=<hash> carimbado no build (ver Dockerfile), então a
    # URL sozinha garante atualização. O no-cache aqui é cinto e suspensório:
    # custa um 304 por carga e protege caso o carimbo falhe algum dia.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # arte e vozes nunca mudam de nome: cache longo no navegador
    location /img/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /audio/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        types { audio/ogg ogg opus; audio/mpeg mp3; audio/mp4 m4a; audio/wav wav; }
        default_type audio/ogg;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # sem listagem de diretório
    autoindex off;
}
