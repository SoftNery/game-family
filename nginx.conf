server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # PNG já vem comprimido; comprimir só o que rende
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # o HTML sempre revalida, senão o navegador segura a versão antiga do jogo
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # css/js mudam a cada deploy: revalidação barata (304 quando não mudou)
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # os 86 PNGs nunca mudam de nome: cache longo no navegador
    location /img/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # sem listagem de diretório
    autoindex off;
}
